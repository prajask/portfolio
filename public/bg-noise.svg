<svg width="1000" height="1000" style={{ position: "absolute" }}>
	<filter id="noise-texture">
		<feTurbulence
		type="fractalNoise"
		baseFrequency="0.85"
		numOctaves="2"
		seed="0"
		stitchTiles="stitch"
		/>
		<feColorMatrix type="saturate" values="0" />
		<feComponentTransfer>
			<feFuncA type="discrete" tableValues="0 0.35" />
		</feComponentTransfer>
		<feBlend mode="multiply" in="SourceGraphic" />
	</filter>
</svg>